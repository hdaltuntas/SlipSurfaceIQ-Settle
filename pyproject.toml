[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slipsurface-settle"
dynamic = ["version"]
description = "Settlement analysis of shallow foundations and embankments (desktop GUI)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Hasan Deniz Altuntaş" }]
keywords = ["geotechnical", "settlement", "consolidation", "foundation", "embankment",
            "Boussinesq", "Schmertmann", "Terzaghi", "reliability"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Natural Language :: Turkish",
    "Natural Language :: English",
]
dependencies = [
    "PySide6>=6.6",
    "numpy>=2.0",
    "matplotlib>=3.7",
    "reportlab>=4.0",
    "QtAwesome>=1.4,<2",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "pypdf>=4.0", "ruff>=0.8", "python-docx>=1.1", "openpyxl>=3.1"]

[project.urls]
Homepage = "https://slipsurface.dev"
Repository = "https://github.com/hdaltuntas/SlipSurfaceIQ-Settle"

[project.gui-scripts]
slipsurface-settle = "slipsurface.settle.cli:main"

[project.scripts]
# The same program with a console, for `run`, `study` and `example` on Windows
slipsurface-settle-cli = "slipsurface.settle.cli:main"

[tool.setuptools.dynamic]
version = { attr = "slipsurface.settle.__version__" }

[tool.setuptools.packages.find]
include = ["slipsurface*"]
namespaces = true

[tool.setuptools.package-data]
"slipsurface.settle" = ["fonts/*.ttf", "fonts/*.txt", "examples/*.settle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist", "packaging/*.spec"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
# E741: `l` / `L` are deliberate domain abbreviations (length, the translations)
ignore = ["E741"]
